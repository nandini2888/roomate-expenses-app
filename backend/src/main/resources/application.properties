# Server Configuration
server.port=8081

# Database Configuration - H2 (In-Memory)
# Note: Data will be lost when application stops. For production, switch back to MySQL.
spring.datasource.url=jdbc:h2:mem:sharing_is_caring
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# H2 Console (Access at http://localhost:8080/h2-console)
# JDBC URL: jdbc:h2:mem:sharing_is_caring
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# MySQL Configuration (commented out - uncomment if switching back to MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/sharing_is_caring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-use-a-strong-random-string
jwt.expiration=86400000

# File Storage
file.upload-dir=./uploads/bills

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000

